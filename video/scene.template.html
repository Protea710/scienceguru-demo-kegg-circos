<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>KEGG circos — 动效脚本</title>
<style>
  :root{
    --bg:#F6F4F1; --ink:#141414; --muted:#6B6B6B; --line:#D9D4CC;
    --amber:#E8A227; --blue:#5B90C6;
    --met-fill:#D6E4F1; --met-edge:#6F94B8;
    --oth-fill:#F2CFDC; --oth-edge:#B96A82;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0E1116}
  body{display:flex;align-items:center;justify-content:center;overflow:hidden;
       font-family:"PingFang SC","Hiragino Sans GB",-apple-system,"Helvetica Neue",Arial,sans-serif}
  #stage{position:relative;width:1920px;height:1080px;transform-origin:center center;
         background:var(--bg);box-shadow:0 24px 80px rgba(0,0,0,.55)}
  canvas{display:block;width:100%;height:100%}
  #hud{position:absolute;left:24px;bottom:20px;display:flex;gap:14px;align-items:center;
       font:12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#8b867e;
       background:rgba(246,244,241,.86);padding:8px 12px;border-radius:8px;
       border:1px solid var(--line);opacity:.9;transition:opacity .25s}
  #hud.hidden{opacity:0;pointer-events:none}
  #bar{position:absolute;left:0;bottom:0;height:3px;background:var(--amber);width:0}
  body.clean #hud,body.clean #bar{display:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div id="hud">
    <span id="clock">0.0s</span>
    <span style="opacity:.5">space 暂停 · R 重播 · ←/→ 跳 1s · H 隐藏</span>
  </div>
  <div id="bar"></div>
</div>
<script>
const DATA = /*__DATA__*/;
const CV = document.getElementById("c");
const G  = CV.getContext("2d");
const W = 1920, H = 1080;

const S = DATA.samples;
const KOS = DATA.kos.slice().sort((a,b)=> (b.v[0]+b.v[1]+b.v[2]) - (a.v[0]+a.v[1]+a.v[2]));
const CLS = DATA.classes;
const CLS_BY = Object.fromEntries(CLS.map(c=>[c.code,c]));
const MET = CLS.filter(c=>c.group==="Metabolism");
const OTH = CLS.filter(c=>c.group!=="Metabolism");

const COL = {
  bg:"#F6F4F1", ink:"#141414", muted:"#6B6B6B", line:"#D9D4CC",
  amber:"#E8A227", blue:"#5B90C6",
  metFill:"#D6E4F1", metEdge:"#6F94B8", othFill:"#F2CFDC", othEdge:"#B96A82",
  s:["#2F6E9E","#D9A21B","#8A63C4"]
};
const CMAP = ["#2E9DA8","#7FC6CC","#F1EBED","#F08CAF","#D8326C"];

// ---------- 时间轴 ----------
const T = {
  a1:[0,6.5], a2:[6.5,15.0], a3:[15.0,28.0], a4:[28.0,40.0],
  a5:[40.0,52.0], a6:[52.0,68.0], a7:[68.0,84.0]
};
const END = T.a7[1];

// ---------- 工具 ----------
const clamp01 = x => x<0?0:x>1?1:x;
const seg = (t,a,b) => clamp01((t-a)/(b-a));
const ease = x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;
const easeOut = x => 1-Math.pow(1-x,3);
const lerp = (a,b,p) => a+(b-a)*p;
const mix = (c1,c2,p) => {
  const h = c => [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
  const A=h(c1),B=h(c2); return `rgb(${Math.round(lerp(A[0],B[0],p))},${Math.round(lerp(A[1],B[1],p))},${Math.round(lerp(A[2],B[2],p))})`;
};
function hex2rgb(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function rgb2hex(r,g,b){ return "#"+[r,g,b].map(v=>Math.round(clamp01(v/255)*255).toString(16).padStart(2,"0")).join(""); }
function heat(v){
  const p = clamp01((v-DATA.vmin)/(DATA.vmax-DATA.vmin));
  const stops = CMAP, x = p*(stops.length-1), i = Math.min(stops.length-2, Math.floor(x)), f = x-i;
  const A = hex2rgb(stops[i]), B = hex2rgb(stops[i+1]);
  return rgb2hex(lerp(A[0],B[0],f), lerp(A[1],B[1],f), lerp(A[2],B[2],f));
}
function rr(x,y,w,h,r){
  G.beginPath();
  G.moveTo(x+r,y); G.lineTo(x+w-r,y); G.quadraticCurveTo(x+w,y,x+w,y+r);
  G.lineTo(x+w,y+h-r); G.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  G.lineTo(x+r,y+h); G.quadraticCurveTo(x,y+h,x,y+h-r);
  G.lineTo(x,y+r); G.quadraticCurveTo(x,y,x+r,y); G.closePath();
}
function text(str,x,y,{size=16,weight=400,color=COL.ink,align="left",mono=false,alpha=1}={}){
  G.globalAlpha = alpha;
  G.fillStyle = color;
  G.font = `${weight} ${size}px ${mono?"ui-monospace,SFMono-Regular,Menlo,monospace":"'PingFang SC','Hiragino Sans GB',-apple-system,sans-serif"}`;
  G.textAlign = align; G.textBaseline = "middle";
  G.fillText(str,x,y);
  G.globalAlpha = 1;
}

// ---------- 版式 ----------
function spreadPos(i){
  const cols=9, rows=6, dx=163, dy=143, x0=104, y0=176;
  const c=i%cols, r=Math.floor(i/cols);
  const inRow = Math.min(cols, KOS.length - r*cols);
  const off = (cols - inRow) * dx / 2;
  return {x:x0+c*dx+off, y:y0+r*dy};
}
function stackPos(i){
  const col=i%2, r=Math.floor(i/2);
  return {x: 902 + col*116, y: 96 + r*37};
}
function ringPos(i, n){
  const a = -Math.PI/2 + i*2*Math.PI/n;
  return {x: 960 + Math.cos(a)*392, y: 520 + Math.sin(a)*392, a};
}
function chipSpread(code){
  const i = CLS.findIndex(c=>c.code===code);
  return {x: 1706, y: 150 + i*52};
}
function chipInCircle(cls, list, cx, cy, r){
  const i = list.findIndex(c=>c.code===cls.code), n = list.length;
  const a = -Math.PI/2 + (i+0.5)*2*Math.PI/n;
  return {x: cx + Math.cos(a)*r, y: cy + Math.sin(a)*r};
}

// ---------- 图元 ----------
function card(x,y,ko,{s=1,alpha=1,compact=false,swatch=null,label=true}={}){
  if(alpha<=0.01) return;
  G.globalAlpha = alpha;
  const w=104*s, h=44*s;
  G.save(); G.translate(x,y);
  rr(-w/2,-h/2,w,h,7*s);
  G.fillStyle="#FFFFFF"; G.fill();
  G.strokeStyle=COL.line; G.lineWidth=1; G.stroke();

  if(swatch){
    rr(-w/2+6*s,-h/2+7*s,10*s,h-14*s,3*s); G.fillStyle=swatch; G.fill();
  }
  if(label) text(ko.id, -w/2+ (swatch?22*s:9*s), -h/2+14*s, {size:11*s, mono:true, alpha:alpha, weight:500});
  const bx=-w/2+(swatch?22*s:9*s), bw=w- (swatch?30*s:18*s);
  ko.v.forEach((v,i)=>{
    const hh = 3*s, yy = h/2-9*s + i*3.4*s;
    G.globalAlpha = alpha*0.9;
    rr(bx, yy, bw, hh, 1.5*s);
    G.fillStyle = COL.s[i]; G.globalAlpha = alpha*(0.25+0.75*clamp01(v/DATA.vmax)); G.fill();
  });
  G.restore(); G.globalAlpha=1;
}

function chip(cls,x,y,{s=1,alpha=1,fit=0}={}){
  if(alpha<=0.01) return;
  const met = cls.group==="Metabolism";
  G.font = `400 ${13*s}px 'PingFang SC','Hiragino Sans GB',-apple-system,sans-serif`;
  const w = fit ? (G.measureText(cls.name).width + 34*s) : 268*s;
  const h=40*s;
  G.globalAlpha = alpha;
  G.save(); G.translate(x,y);
  rr(-w/2,-h/2,w,h,20*s);
  G.fillStyle = met? COL.metFill : COL.othFill; G.fill();
  G.strokeStyle = met? COL.metEdge : COL.othEdge; G.lineWidth = 1.4*s; G.stroke();
  text(cls.name, -w/2+16*s, 0, {size:13*s, alpha:alpha, color:"#1b1b1b"});
  G.restore(); G.globalAlpha=1;
}

function link(x1,y1,x2,y2,{alpha=.3,width=1,color=COL.amber,bend=.25}={}){
  if(alpha<=0.01) return;
  const mx=(x1+x2)/2, my=(y1+y2)/2 + (y2-y1)*0;
  G.beginPath();
  G.moveTo(x1,y1);
  G.bezierCurveTo(x1+(x2-x1)*bend, y1+(y2-y1)*bend*0.2, x2-(x2-x1)*bend, y2-(y2-y1)*bend*0.2, x2,y2);
  G.strokeStyle=color; G.globalAlpha=alpha; G.lineWidth=width;
  G.stroke(); G.globalAlpha=1;
}

// ---------- 第一幕：一堆数据表格 ----------
function fake(seed,row,tick){
  let h = (seed*73856093) ^ (row*19349663) ^ (tick*83492791);
  h = (h ^ (h>>>13)) * 1274126177; h = h ^ (h>>>16);
  return ((h>>>0) % 9000)/10000 + 0.05;
}
function drawTable(x,y,seed,t,alpha,tick,rot=0){
  G.globalAlpha = alpha;
  const w=300,h=205;
  G.save(); G.translate(x+w/2,y+h/2); G.rotate(rot*Math.PI/180); G.translate(-w/2,-h/2);
  rr(0,0,w,h,10); G.fillStyle="#FFFFFF"; G.fill();
  G.strokeStyle=COL.line; G.lineWidth=1; G.stroke();
  G.fillStyle="#EFEAE3"; G.fillRect(0,1,w,32);
  text("KO",16,17,{size:11,color:COL.muted,mono:true,alpha:alpha});
  ["LA1","LB1","LC1"].forEach((s,i)=> text(s,150+i*52,17,{size:11,color:COL.muted,mono:true,alpha:alpha}));
  for(let r=0;r<5;r++){
    const yy=52+r*30;
    text("K"+String(10000+Math.floor(fake(seed,r,tick)*20000)), 16, yy, {size:11,mono:true,color:"#2A2A2A",alpha:alpha});
    for(let c=0;c<3;c++){
      const v=fake(seed+r*7,c+3,tick);
      text(v.toFixed(2), 150+c*52, yy, {size:11,mono:true,color:COL.s[c],alpha:alpha*0.9});
    }
    G.strokeStyle="#F1EDE7"; G.beginPath(); G.moveTo(12,yy+15); G.lineTo(w-12,yy+15); G.stroke();
  }
  G.restore(); G.globalAlpha=1;
}
function act1(t){
  const a = Math.min(easeOut(seg(t,0,0.9)), 1-ease(seg(t,5.5,6.6)));
  if(a<=0.01) return;
  const tick = Math.floor(t*2.2);
  for(let i=0;i<15;i++){
    const d = i*97;
    const x = 62 + (i%5)*356 + Math.sin(t*0.35+i*1.3)*14;
    const y = 92 + Math.floor(i/5)*330 + Math.cos(t*0.28+i*1.9)*12;
    drawTable(x,y,d,t,a,tick,((i%3)-1)*0.9);
  }
  text("这是一份原始的 KO 丰度表：48 个功能基因 × 3 个样本", W/2, 46,
       {size:19,color:COL.muted,align:"center",alpha:a});
}

// ---------- 第二幕：一个 KO 的三组数与它的归属 ----------
function act2(t){
  const a = Math.min(ease(seg(t,T.a2[0]+0.2,T.a2[0]+1.2)), 1-ease(seg(t,14.0,15.0)));
  if(a<=0.01) return;
  const ko = KOS[0];
  const grow = easeOut(seg(t,7.0,8.4));
  const cx=960, cy=470, w=620*grow, h=330*grow;
  const left = cx-w/2, top = cy-h/2;

  G.globalAlpha=a;
  rr(left,top,w,h,18); G.fillStyle="#FFFFFF"; G.fill();
  G.strokeStyle=COL.line; G.lineWidth=1.2; G.stroke();

  text(ko.id, left+40, top+62, {size:50,mono:true,weight:600,alpha:a*grow});
  text("第一个 KO：它在三个样本里的相对丰度", left+42, top+108, {size:15,color:COL.muted,alpha:a*grow});

  const vmax = DATA.vmax*1.25;
  ko.v.forEach((v,i)=>{
    const p = ease(seg(t,8.4+i*0.4, 9.8+i*0.4));
    const x = left+44+i*184;
    text(S[i], x, top+158, {size:14,color:COL.s[i],mono:true,weight:600,alpha:a*p});
    text(v.toFixed(2)+"%", x, top+206, {size:34,mono:true,weight:600,alpha:a*p});
    const bw = 148*clamp01(v/vmax);
    G.globalAlpha=a*p*0.9; rr(x, top+240, bw*p, 9, 4); G.fillStyle=COL.s[i]; G.fill(); G.globalAlpha=1;
    G.globalAlpha=a*p*0.18; rr(x, top+240, 148, 9, 4); G.strokeStyle=COL.line; G.lineWidth=1; G.stroke(); G.globalAlpha=1;
  });

  const pc = seg(t,10.4,11.4);
  if(pc>0){
    const cls = CLS_BY[ko.c[0]];
    const cy2 = top+h+78;
    chip(cls, cx, cy2, {alpha:a*ease(pc), s:1.02});
    link(cx, top+h+4, cx, cy2-26, {alpha:a*ease(pc), color: cls.group==="Metabolism"?COL.metEdge:COL.othEdge, width:1.6, bend:.1});
    text("它只属于一个功能类", cx+180, cy2, {size:14,color:COL.muted,alpha:a*ease(pc)});
  }
}

// ---------- 图的真实几何 ----------
const GEO = {CX:840, CY:512, U:412,
  KO_IN:0.545, LABEL:0.600, HEAT:0.742, ROW:0.036, KO_OUT:0.850,
  BAR_BASE:0.650, BAR_MAX:0.252, ARC:0.914, CLS_LABEL:0.972};
const LINKS = {}; KOS.forEach(k=>k.c.forEach(c=>LINKS[c]=(LINKS[c]||0)+1));
const KO_ANG = (()=>{ const n=KOS.length, gap=0.60, span=236, w=(span-gap*n)/n;
  return KOS.map((_,i)=>{ const a1=298-i*(w+gap); return [a1-w,a1]; }); })();
const CLS_ANG = (()=>{ const gap=1.8, span=112, usable=span-gap*CLS.length;
  const tot=CLS.reduce((s,c)=>s+(LINKS[c.code]||1),0); let a=-56;
  const m={}; CLS.forEach(c=>{ const w=usable*(LINKS[c.code]||1)/tot; m[c.code]=[a,a+w]; a+=w+gap; });
  return m; })();

function rad(d){ return d*Math.PI/180; }
function pt(deg,r){ return {x:GEO.CX+Math.cos(rad(deg))*r*GEO.U, y:GEO.CY-Math.sin(rad(deg))*r*GEO.U}; }
function ann(r0,r1,a0,a1,fill,alpha){
  G.globalAlpha=alpha; G.beginPath();
  G.arc(GEO.CX,GEO.CY,r1*GEO.U,-rad(a1),-rad(a0),false);
  G.arc(GEO.CX,GEO.CY,r0*GEO.U,-rad(a0),-rad(a1),true);
  G.closePath(); G.fillStyle=fill; G.fill(); G.globalAlpha=1;
}
function hair(r,alpha){ G.globalAlpha=alpha; G.beginPath(); G.arc(GEO.CX,GEO.CY,r*GEO.U,0,Math.PI*2);
  G.strokeStyle="#BDBDBD"; G.lineWidth=0.8; G.stroke(); G.globalAlpha=1; }
function radialLabel(deg,r,str,{size=13,alpha=1,weight=400,color="#141414",align="left"}={}){
  if(alpha<=0.01) return;
  const p = pt(deg,r);
  let rot = -deg, flip = false;
  let d = ((deg%360)+360)%360;
  if(d>90 && d<270){ rot = -deg+180; flip = true; }
  G.save(); G.translate(p.x,p.y); G.rotate(rad(rot));
  text(str,0,0,{size,alpha,weight,color,align:flip?"right":"left"});
  G.restore();
}

// ---------- 第三幕：KO 一圈一圈立起来 ----------
function act3(t){
  const fade = 1-ease(seg(t,39.2,40.4));
  const a = Math.min(ease(seg(t,15.0,15.6)), fade);
  if(a<=0.01) return;
  const shown = clamp01((t-15.6)/9.2);
  const nShow = Math.floor(shown*KOS.length);

  hair(GEO.KO_OUT, a*0.5); hair(GEO.HEAT, a*0.5);

  for(let i=0;i<=nShow && i<KOS.length;i++){
    const ko = KOS[i], [a0,a1] = KO_ANG[i];
    const p = easeOut(clamp01((shown*KOS.length-i)/1.2));
    const R = GEO.ROW;
    for(let j=0;j<3;j++){
      const r0 = GEO.HEAT + (2-j)*R;
      ann(r0, r0+R*0.94, a0, a1, mix("#EDE8E1", heat(ko.v[j]), p), a*(0.35+0.65*p));
    }
  }

  const lab = ease(seg(t,22.0,27.0));
  if(lab>0){
    KOS.forEach((ko,i)=>{
      if(i>nShow) return;
      const [a0,a1] = KO_ANG[i];
      radialLabel((a0+a1)/2, GEO.LABEL, ko.id, {size:9.5, alpha:a*lab*0.95, color:"#2a2a2a"});
    });
  }
  text(`${Math.min(nShow,KOS.length)} / 48 个 KO 立到了圆周上`, 118, 118,
       {size:16,color:COL.muted,alpha:a*seg(t,15.6,16.6)});
}

// ---------- 第四幕：功能类分成两色，弦连起来 ----------
function act4(t){
  const fade = 1-ease(seg(t,39.2,40.4));
  const a = Math.min(ease(seg(t,27.6,28.4)), fade);
  if(a<=0.01) return;

  const shown = 1;
  KOS.forEach((ko,i)=>{
    const [a0,a1] = KO_ANG[i];
    for(let j=0;j<3;j++){
      const r0 = GEO.HEAT + (2-j)*GEO.ROW;
      ann(r0, r0+GEO.ROW*0.94, a0, a1, heat(ko.v[j]), a*0.95);
    }
    radialLabel((a0+a1)/2, GEO.LABEL, ko.id, {size:9.5, alpha:a*0.9, color:"#2a2a2a"});
  });
  hair(GEO.KO_OUT, a*0.5); hair(GEO.HEAT, a*0.5);

  const trk = ease(seg(t,28.2,30.2));
  CLS.forEach(c=>{
    const [a0,a1] = CLS_ANG[c.code];
    const met = c.group==="Metabolism";
    ann(GEO.BAR_BASE-0.020, GEO.ARC, a0, a1,
        met? "rgba(214,228,241,.85)" : "rgba(242,207,220,.85)", a*trk);
    G.globalAlpha=a*trk; G.beginPath();
    G.arc(GEO.CX,GEO.CY,GEO.ARC*GEO.U,-rad(a1),-rad(a0),false);
    G.strokeStyle=met? COL.metEdge : COL.othEdge; G.lineWidth=1.2; G.stroke(); G.globalAlpha=1;
  });

  const barP = ease(seg(t,29.2,34.4));
  const barMax = Math.max(...CLS.flatMap(c=>c.sums));
  CLS.forEach(c=>{
    const [a0,a1] = CLS_ANG[c.code], span=a1-a0;
    c.sums.forEach((v,i)=>{
      const h = GEO.BAR_MAX*barP*v/barMax;
      const w = span/3*0.9, s0 = a0+span*(0.05+i/3);
      ann(GEO.BAR_BASE, GEO.BAR_BASE+h, s0, s0+w, COL.s[i], a*barP);
    });
  });

  const chordP = seg(t,31.2,37.8);
  KOS.forEach((ko,i)=>{
    const p = easeOut(clamp01((chordP*KOS.length-i)/6));
    if(p<=0) return;
    const km = (KO_ANG[i][0]+KO_ANG[i][1])/2;
    ko.c.forEach(code=>{
      const [c0,c1] = CLS_ANG[code];
      const cm = (c0+c1)/2;
      const A = pt(km, GEO.KO_IN), B = pt(cm, GEO.BAR_BASE-0.014);
      const cA = pt(km, GEO.KO_IN*0.34), cB = pt(cm, (GEO.BAR_BASE-0.014)*0.34);
      G.beginPath(); G.moveTo(A.x,A.y);
      G.bezierCurveTo(cA.x,cA.y,cB.x,cB.y,B.x,B.y);
      G.strokeStyle = CLS_BY[code].group==="Metabolism"? COL.amber : COL.blue;
      G.globalAlpha = a*0.42*p; G.lineWidth = 0.8+ko.d*0.06; G.stroke(); G.globalAlpha=1;
    });
  });

  const labP = ease(seg(t,34.4,37.4));
  CLS.forEach((c,i)=>{
    const [a0,a1] = CLS_ANG[c.code];
    radialLabel((a0+a1)/2, GEO.CLS_LABEL, c.name, {size:12, alpha:a*labP, weight:600});
  });

  const tagP = ease(seg(t,35.0,36.4));
  [["Metabolism",MET,COL.metEdge],["Other",OTH,COL.othEdge]].forEach(([nm,list,col])=>{
    const angs = list.map(c=>(CLS_ANG[c.code][0]+CLS_ANG[c.code][1])/2);
    const mid = (Math.min(...angs)+Math.max(...angs))/2;
    const p = pt(mid, 1.30);
    text(nm, p.x, p.y, {size:16,weight:600,color:col,align:"center",alpha:a*tagP});
  });
}

function withChart(cx, cy, sc, fn){
  G.save(); G.translate(cx,cy); G.scale(sc,sc); G.translate(-GEO.CX,-GEO.CY); fn(); G.restore();
}
function drawChart(a, idsP, labP, chrP){
  hair(GEO.KO_OUT, a*0.6); hair(GEO.HEAT, a*0.6);

  KOS.forEach((ko,i)=>{
    const [a0,a1] = KO_ANG[i];
    for(let j=0;j<3;j++){
      const r0 = GEO.HEAT + (2-j)*GEO.ROW;
      ann(r0, r0+GEO.ROW*0.94, a0, a1, heat(ko.v[j]), a*0.97);
    }
    if(idsP>0) radialLabel((a0+a1)/2, GEO.LABEL, ko.id, {size:9.5, alpha:a*idsP*0.95, color:"#2a2a2a"});
  });

  CLS.forEach(c=>{
    const [a0,a1] = CLS_ANG[c.code], met = c.group==="Metabolism";
    ann(GEO.BAR_BASE-0.020, GEO.ARC, a0, a1,
        met? "rgba(214,228,241,.9)" : "rgba(242,207,220,.9)", a);
    G.globalAlpha=a; G.beginPath();
    G.arc(GEO.CX,GEO.CY,GEO.ARC*GEO.U,-rad(a1),-rad(a0),false);
    G.strokeStyle=met? COL.metEdge : COL.othEdge; G.lineWidth=1.2; G.stroke(); G.globalAlpha=1;
  });

  const barMax = Math.max(...CLS.flatMap(c=>c.sums));
  CLS.forEach(c=>{
    const [a0,a1] = CLS_ANG[c.code], span=a1-a0;
    c.sums.forEach((v,i)=>{
      const h = GEO.BAR_MAX*chrP*v/barMax;
      const w = span/3*0.9, s0 = a0+span*(0.05+i/3);
      ann(GEO.BAR_BASE, GEO.BAR_BASE+h, s0, s0+w, COL.s[i], a*chrP);
    });
  });

  KOS.forEach((ko,i)=>{
    const km=(KO_ANG[i][0]+KO_ANG[i][1])/2;
    ko.c.forEach(code=>{
      const [c0,c1]=CLS_ANG[code], cm=(c0+c1)/2;
      const A=pt(km,GEO.KO_IN), B=pt(cm,GEO.BAR_BASE-0.014);
      const cA=pt(km,GEO.KO_IN*0.34), cB=pt(cm,(GEO.BAR_BASE-0.014)*0.34);
      G.beginPath(); G.moveTo(A.x,A.y); G.bezierCurveTo(cA.x,cA.y,cB.x,cB.y,B.x,B.y);
      G.strokeStyle = CLS_BY[code].group==="Metabolism"? COL.amber : COL.blue;
      G.globalAlpha=a*0.30*chrP; G.lineWidth=0.8+ko.d*0.06; G.stroke(); G.globalAlpha=1;
    });
  });

  if(labP>0){
    CLS.forEach(c=>{
      const [a0,a1]=CLS_ANG[c.code];
      radialLabel((a0+a1)/2, GEO.CLS_LABEL, c.name, {size:12, alpha:a*labP, weight:600});
    });
  }
}

// ---------- 第五幕：两个数字 ----------
function act5(t){
  const a = Math.min(ease(seg(t,40.6,41.4)), 1-ease(seg(t,51.0,52.2)));
  if(a<=0.01) return;
  const blocks = [
    {x:520,  value:`${DATA.vmin.toFixed(2)}–${DATA.vmax.toFixed(2)}%`, label:"relative abundance per sample"},
    {x:1400, value:"1–16", label:"connection degree"}
  ];
  blocks.forEach((b,i)=>{
    const p = ease(seg(t,41.0+i*1.1, 42.6+i*1.1));
    G.globalAlpha=a*0.85; G.strokeStyle=COL.line; G.lineWidth=1;
    G.beginPath(); G.moveTo(b.x-220,452); G.lineTo(b.x-220+440*p,452); G.stroke(); G.globalAlpha=1;
    text(b.label, b.x-220, 494, {size:18,color:COL.muted,alpha:a*p});
    const gp = ease(seg(t,41.6+i*1.1, 43.6+i*1.1));
    text(b.value, b.x-220, 494+72, {size:lerp(62,104,gp),weight:600,alpha:a*gp});
  });
  text("一个说的是「量」，一个说的是「连接」", 960, 792,
       {size:19,color:COL.muted,align:"center",alpha:a*ease(seg(t,46.0,47.6))});
}

// ---------- 第六幕：收成那张图 ----------
function act6(t){
  const a = 1-ease(seg(t,66.6,68.0));
  if(a<=0.01) return;
  const grow = ease(seg(t,52.4,58.0));
  const sc = lerp(0.62, 1.0, grow);
  const idsP = ease(seg(t,55.6,61.0));
  const labP = ease(seg(t,57.0,62.4));
  const chrP = ease(seg(t,53.0,57.0));

  withChart(960, 520, sc, ()=> drawChart(a*grow, idsP, labP, chrP));

  const leg = ease(seg(t,62.4,64.4));
  if(leg>0){
    ["control","manure","straw"].forEach((tag,i)=>{
      const x=118, y=902+i*38;
      G.globalAlpha=a*leg; rr(x,y,15,15,3); G.fillStyle=COL.s[i]; G.fill(); G.globalAlpha=1;
      text(S[i], x+26, y+8, {size:14,mono:true,alpha:a*leg});
      text(tag, x+90, y+8, {size:14,color:COL.muted,alpha:a*leg});
    });
    text("相对丰度 0.17–0.69%　·　连接度 1–16", 960, 96,
         {size:17,color:COL.muted,align:"center",alpha:a*leg});
  }
}

// ---------- 第七幕：落成真图 + 标题 ----------
let FIG = null;
const img = new Image();
img.onload = ()=>{ FIG = img; };
img.src = "../output/figure.png";

const TITLE = "一张图，怎么从数据长出来";
const CAPS = [
  "48 个 KO · 3 个样本 · 17 个功能类",
  "每个数字来自公开数据：KEGG BRITE + figshare",
  "一条命令重画 · 129 项校验"
];
const PNG_H = 760, PNG_W = PNG_H*2379/2092;
const CARD = {x: 960, y: 440};
const PNG_AT = {x: CARD.x-PNG_W/2, y: CARD.y-PNG_H/2};
const CHART_C = {x: PNG_AT.x + 0.4817*PNG_W, y: PNG_AT.y + 0.5562*PNG_H};
const S_FINAL = (0.2800*PNG_W) / (0.850*GEO.U);

function act7(t){
  const shrink = ease(seg(t,68.0,71.4));
  const fadeIn = ease(seg(t,71.8,73.4));
  const chartOut = 1-ease(seg(t,71.8,73.2));

  if(chartOut>0.01){
    const sc = lerp(1.0, S_FINAL, shrink);
    const cx = lerp(960, CHART_C.x, shrink), cy = lerp(520, CHART_C.y, shrink);
    withChart(cx, cy, sc, ()=> drawChart(chartOut*0.97, 1, 1, 1));
  }
  if(FIG && fadeIn>0){
    G.globalAlpha = fadeIn;
    G.drawImage(FIG, PNG_AT.x, PNG_AT.y, PNG_W, PNG_H);
    G.globalAlpha = 1;
  }

  const typed = Math.min(TITLE.length, Math.floor(seg(t,73.8,76.8)*TITLE.length));
  G.font = "600 44px 'PingFang SC','Hiragino Sans GB',sans-serif";
  const tw = G.measureText(TITLE).width;
  text(TITLE.slice(0,typed), 960-tw/2, 880, {size:44,weight:600,align:"left"});
  if(typed<TITLE.length && Math.floor(t*6)%2===0){
    const pw = G.measureText(TITLE.slice(0,typed)).width;
    G.fillStyle=COL.ink; G.fillRect(960-tw/2+pw+4, 860, 3, 42);
  }
  CAPS.forEach((c,i)=>{
    const p = ease(seg(t,77.6+i*2.2, 77.6+i*2.2+1.1));
    text(c, 960, 932+i*32, {size:17,color:i===0?COL.ink:COL.muted,align:"center",alpha:p});
  });
  text("github.com/Protea710/scienceguru-demo-kegg-circos", 960, 1040,
       {size:13,mono:true,color:COL.muted,align:"center",alpha:ease(seg(t,82.4,83.6))});
}

// ---------- 主循环 ----------
function frame(t){
  G.setTransform(1,0,0,1,0,0);
  G.fillStyle=COL.bg; G.fillRect(0,0,W,H);
  if(t < T.a1[1]+1.5) act1(t);
  if(t > T.a2[0]-0.2) act2(t);
  if(t > T.a3[0]-0.2) act3(t);
  if(t > T.a4[0]-0.2) act4(t);
  if(t > T.a5[0]-0.2) act5(t);
  if(t > T.a6[0]-0.2) act6(t);
  if(t > T.a7[0]-0.2) act7(t);
}

let t = 0, playing = true, last = 0;
const q = new URLSearchParams(location.search);
if(q.has("t")) { t = parseFloat(q.get("t")); playing = false; }
if(q.get("hud")==="0") document.body.classList.add("clean");

function fit(){
  const k = Math.min(innerWidth/W, innerHeight/H);
  document.getElementById("stage").style.transform = `scale(${k})`;
}
addEventListener("resize", fit); fit();

const clock = document.getElementById("clock"), bar = document.getElementById("bar");
function tick(ts){
  if(!last) last = ts;
  const dt = Math.min(0.05,(ts-last)/1000); last = ts;
  if(playing){ t += dt; if(t>END) t = END; }
  frame(Math.min(t,END));
  clock.textContent = t.toFixed(1)+"s";
  bar.style.width = (100*t/END)+"%";
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

addEventListener("keydown", e=>{
  if(e.code==="Space"){ playing=!playing; e.preventDefault(); }
  if(e.key==="r"||e.key==="R"){ t=0; playing=true; }
  if(e.key==="ArrowRight"){ t=Math.min(END,t+1); }
  if(e.key==="ArrowLeft"){ t=Math.max(0,t-1); }
  if(e.key==="h"||e.key==="H"){ document.body.classList.toggle("clean"); }
});
