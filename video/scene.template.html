<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>KEGG circos — 图的生成过程</title>
<style>
  :root{ --bg:#F6F4F1; --ink:#141414; --muted:#6B6B6B; --line:#D9D4CC; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0E1116}
  body{display:flex;align-items:center;justify-content:center;overflow:hidden;
       font-family:"PingFang SC","Hiragino Sans GB",-apple-system,"Helvetica Neue",Arial,sans-serif}
  #stage{position:relative;width:1920px;height:1080px;transform-origin:center center;
         background:var(--bg);box-shadow:0 24px 80px rgba(0,0,0,.55)}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  #fig{position:absolute;inset:0}
  #fig svg{position:absolute;left:530px;top:14px;width:860px;height:auto}
  #hud{position:absolute;left:24px;bottom:20px;display:flex;gap:14px;align-items:center;
       font:12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#8b867e;
       background:rgba(246,244,241,.86);padding:8px 12px;border-radius:8px;
       border:1px solid var(--line);opacity:.9}
  #hud.hidden{opacity:0;pointer-events:none}
  #bar{position:absolute;left:0;bottom:0;height:3px;background:#E8A227;width:0}
  body.clean #hud,body.clean #bar{display:none}
</style>
</head>
<body>
<div id="stage">
  <div id="fig"><!--__SVG__--></div>
  <canvas id="c" width="1920" height="1080"></canvas>
  <div id="hud"><span id="clock">0.0s</span>
    <span style="opacity:.5">space 暂停 · R 重播 · ←/→ 跳 1s · H 隐藏</span></div>
  <div id="bar"></div>
</div>
<script>
const DATA = /*__DATA__*/;
const CV = document.getElementById("c"), G = CV.getContext("2d");
const W = 1920, H = 1080;
const S = DATA.samples;
const KOS = DATA.kos.slice().sort((a,b)=>(b.v[0]+b.v[1]+b.v[2])-(a.v[0]+a.v[1]+a.v[2]));
const CLS = DATA.classes;
const COL = { bg:"#F6F4F1", ink:"#141414", muted:"#6B6B6B", line:"#D9D4CC",
              amber:"#E8A227", blue:"#5B90C6", s:["#2F6E9E","#D9A21B","#8A63C4"] };
const CMAP = ["#2E9DA8","#7FC6CC","#F1EBED","#F08CAF","#D8326C"];

const T = { a1:[0,6.5], a2:[6.5,15.0], build:[15.0,62.0], a7:[62.0,80.0] };
const END = 80;

const clamp01 = x => x<0?0:x>1?1:x;
const seg = (t,a,b) => clamp01((t-a)/(b-a));
const ease = x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;
const easeOut = x => 1-Math.pow(1-x,3);
const lerp = (a,b,p) => a+(b-a)*p;
function hex2rgb(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function rgb2hex(r,g,b){ return "#"+[r,g,b].map(v=>Math.round(clamp01(v/255)*255).toString(16).padStart(2,"0")).join(""); }
function heat(v){
  const p = clamp01((v-DATA.vmin)/(DATA.vmax-DATA.vmin));
  const x = p*(CMAP.length-1), i = Math.min(CMAP.length-2, Math.floor(x)), f = x-i;
  const A = hex2rgb(CMAP[i]), B = hex2rgb(CMAP[i+1]);
  return rgb2hex(lerp(A[0],B[0],f), lerp(A[1],B[1],f), lerp(A[2],B[2],f));
}
function rr(x,y,w,h,r){ G.beginPath(); G.moveTo(x+r,y); G.lineTo(x+w-r,y);
  G.quadraticCurveTo(x+w,y,x+w,y+r); G.lineTo(x+w,y+h-r); G.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  G.lineTo(x+r,y+h); G.quadraticCurveTo(x,y+h,x,y+h-r); G.lineTo(x,y+r);
  G.quadraticCurveTo(x,y,x+r,y); G.closePath(); }
function text(str,x,y,{size=16,weight=400,color=COL.ink,align="left",mono=false,alpha=1}={}){
  G.globalAlpha=alpha; G.fillStyle=color;
  G.font=`${weight} ${size}px ${mono?"ui-monospace,SFMono-Regular,Menlo,monospace":"'PingFang SC','Hiragino Sans GB',-apple-system,sans-serif"}`;
  G.textAlign=align; G.textBaseline="middle"; G.fillText(str,x,y); G.globalAlpha=1;
}

// ---------- 第一幕：原始表格 ----------
function fake(seed,row,tick){
  let h=(seed*73856093)^(row*19349663)^(tick*83492791);
  h=(h^(h>>>13))*1274126177; h=h^(h>>>16);
  return ((h>>>0)%9000)/10000+0.05;
}
function drawTable(x,y,seed,alpha,tick,rot){
  G.globalAlpha=alpha; const w=300,h=205;
  G.save(); G.translate(x+w/2,y+h/2); G.rotate(rot*Math.PI/180); G.translate(-w/2,-h/2);
  rr(0,0,w,h,10); G.fillStyle="#FFFFFF"; G.fill(); G.strokeStyle=COL.line; G.lineWidth=1; G.stroke();
  G.fillStyle="#EFEAE3"; G.fillRect(0,1,w,32);
  text("KO",16,17,{size:11,color:COL.muted,mono:true,alpha});
  S.forEach((s,i)=>text(s,150+i*52,17,{size:11,color:COL.muted,mono:true,alpha}));
  for(let r=0;r<5;r++){
    const yy=52+r*30;
    text("K"+String(10000+Math.floor(fake(seed,r,tick)*20000)),16,yy,{size:11,mono:true,color:"#2A2A2A",alpha});
    for(let c=0;c<3;c++) text(fake(seed+r*7,c+3,tick).toFixed(2),150+c*52,yy,{size:11,mono:true,color:COL.s[c],alpha:alpha*0.9});
    G.strokeStyle="#F1EDE7"; G.beginPath(); G.moveTo(12,yy+15); G.lineTo(w-12,yy+15); G.stroke();
  }
  G.restore(); G.globalAlpha=1;
}
function act1(t){
  const a=Math.min(easeOut(seg(t,0,0.9)),1-ease(seg(t,5.6,6.7)));
  if(a<=0.01) return;
  const tick=Math.floor(t*2.2);
  for(let i=0;i<15;i++){
    const x=62+(i%5)*356+Math.sin(t*0.35+i*1.3)*14;
    const y=92+Math.floor(i/5)*330+Math.cos(t*0.28+i*1.9)*12;
    drawTable(x,y,i*97,a,tick,((i%3)-1)*0.9);
  }
  text("原始的 KO 丰度表：48 个功能基因 × 3 个样本", W/2, 46, {size:19,color:COL.muted,align:"center",alpha:a});
}

// ---------- 第二幕：一个 KO ----------
function act2(t){
  const a=Math.min(ease(seg(t,T.a2[0]+0.2,T.a2[0]+1.2)),1-ease(seg(t,14.0,15.0)));
  if(a<=0.01) return;
  const ko=KOS[0], grow=easeOut(seg(t,7.0,8.4));
  const cx=960, cy=470, w=620*grow, h=330*grow, left=cx-w/2, top=cy-h/2;
  G.globalAlpha=a; rr(left,top,w,h,18); G.fillStyle="#FFFFFF"; G.fill();
  G.strokeStyle=COL.line; G.lineWidth=1.2; G.stroke();
  text(ko.id,left+40,top+62,{size:50,mono:true,weight:600,alpha:a*grow});
  text("第一个 KO：它在三个样本里的相对丰度",left+42,top+108,{size:15,color:COL.muted,alpha:a*grow});
  const vmax=DATA.vmax*1.25;
  ko.v.forEach((v,i)=>{
    const p=ease(seg(t,8.4+i*0.4,9.8+i*0.4));
    const x=left+44+i*184;
    text(S[i],x,top+158,{size:14,color:COL.s[i],mono:true,weight:600,alpha:a*p});
    text(v.toFixed(2)+"%",x,top+206,{size:34,mono:true,weight:600,alpha:a*p});
    const bw=148*clamp01(v/vmax);
    G.globalAlpha=a*p; rr(x,top+240,148,9,4); G.fillStyle="#EFEAE3"; G.fill(); G.globalAlpha=1;
    G.globalAlpha=a*p; rr(x,top+240,bw,9,4); G.fillStyle=COL.s[i]; G.fill(); G.globalAlpha=1;
  });
  const pc=seg(t,10.4,11.4);
  if(pc>0){
    const cls=CLS.find(c=>c.code===ko.c[0]);
    const met=cls.group==="Metabolism";
    const w2=300*grow, x2=cx-w2/2, y2=top+h+52;
    G.globalAlpha=a*ease(pc);
    rr(x2,y2,w2,40,20); G.fillStyle=met?"#D6E4F1":"#F2CFDC"; G.fill();
    G.strokeStyle=met?"#6F94B8":"#B96A82"; G.lineWidth=1.4; G.stroke(); G.globalAlpha=1;
    text(cls.name,cx,y2+20,{size:15,align:"center",alpha:a*ease(pc)});
    G.globalAlpha=a*ease(pc); G.beginPath(); G.moveTo(cx,top+h+6); G.lineTo(cx,y2-6);
    G.strokeStyle=met?"#6F94B8":"#B96A82"; G.lineWidth=1.6; G.stroke(); G.globalAlpha=1;
  }
}

// ---------- 驱动真图 SVG ----------
const figRoot = document.getElementById("fig");
const pick = sel => Array.from(figRoot.querySelectorAll(sel));
const cells  = pick('[id^="cell-"]');
const koids  = pick('[id^="kolab-"]');
const chords = pick('[id^="chord-"]');
const tracks = pick('[id^="track-"]');
const bars   = pick('[id^="bar-"]');
const clabs  = pick('[id^="clab-"]');
const cbs    = pick('[id^="cb"]');
const cbts   = pick('[id^="cbt"]');
const degs   = pick('[id^="deg"]');
const legs   = pick('[id^="leg"]');
const creds  = pick('[id^="cred"]');
const heads  = pick('[id^="head-"]');
const LAYERS = [cells,koids,chords,tracks,bars,clabs,cbs,cbts,degs,legs,creds,heads];
LAYERS.forEach(list=>list.forEach(el=>{ el.style.opacity = 0; }));
figRoot.style.opacity = 0;

function setAll(list,p){ const a=clamp01(p); list.forEach(el=>{ el.style.opacity=a; }); }
function setStagger(list,p,key,span=0.75){
  if(p<=0) return;
  const n = list.length;
  list.forEach((el, idx)=>{
    const i = key(el, idx, n);
    const local = clamp01((p*(1+span) - i*span));
    el.style.opacity = local;
  });
}
// 顺序即文档顺序：cell/kolab 按 KO 排列，chord 按连边，clab/bar 按功能类
const byPos = (el, i, n)=> i/Math.max(1,n-1);

function driveFigure(t){
  const figA = ease(seg(t,14.6,15.6));
  figRoot.style.opacity = figA;
  if(figA<=0) return;
  setStagger(cells,  seg(t,15.2,26.4), byPos, 0.85);
  setStagger(koids,  seg(t,24.0,33.0), byPos, 0.80);
  setAll(tracks,     seg(t,29.0,34.0));
  setStagger(bars,   seg(t,33.0,42.5), byPos, 0.75);
  setStagger(chords, seg(t,35.0,52.0), byPos, 0.92);
  setStagger(clabs,  seg(t,45.0,56.0), byPos, 0.70);
  setAll(heads,      seg(t,52.0,58.0));
  setAll(cbs,        seg(t,54.0,58.5));
  setAll(cbts,       seg(t,55.5,59.0));
  setAll(degs,       seg(t,56.0,59.5));
  setAll(legs,       seg(t,57.0,60.5));
  setAll(creds,      seg(t,59.0,61.0));
}

// ---------- 结尾：标题与讲解 ----------
const TITLE = "一张图，怎么从数据长出来";
const CAPS = [
  "48 个 KO · 3 个样本 · 17 个功能类",
  "每个数字来自公开数据：KEGG BRITE + figshare",
  "一条命令重画 · 129 项校验"
];
function act7(t){
  if(t < T.a7[0]) return;
  const typed = Math.min(TITLE.length, Math.floor(seg(t,62.4,65.4)*TITLE.length));
  G.font = "600 44px 'PingFang SC','Hiragino Sans GB',sans-serif";
  const tw = G.measureText(TITLE).width;
  text(TITLE.slice(0,typed), 960-tw/2, 828, {size:42,weight:600,align:"left"});
  if(typed<TITLE.length && Math.floor(t*6)%2===0){
    const pw = G.measureText(TITLE.slice(0,typed)).width;
    G.fillStyle=COL.ink; G.fillRect(960-tw/2+pw+4, 810, 3, 38);
  }
  CAPS.forEach((c,i)=>{
    const p = ease(seg(t,66.2+i*2.2, 66.2+i*2.2+1.1));
    text(c, 960, 886+i*32, {size:17,color:i===0?COL.ink:COL.muted,align:"center",alpha:p});
  });
  text("github.com/Protea710/scienceguru-demo-kegg-circos", 960, 1010,
       {size:13,mono:true,color:COL.muted,align:"center",alpha:ease(seg(t,72.5,74.0))});
}

// ---------- 主循环 ----------
function frame(t){
  if(t < 15.2){ G.fillStyle=COL.bg; G.fillRect(0,0,W,H); }
  else { G.clearRect(0,0,W,H); }
  if(t < 7.2) act1(t);
  if(t > T.a2[0]-0.2 && t < 15.2) act2(t);
  driveFigure(t);
  act7(t);
}

let t = 0, playing = true, last = 0;
const q = new URLSearchParams(location.search);
if(q.has("t")){ t = parseFloat(q.get("t")); playing = false; }
if(q.get("hud")==="0") document.body.classList.add("clean");

function fit(){
  const k = Math.min(innerWidth/W, innerHeight/H);
  document.getElementById("stage").style.transform = `scale(${k})`;
}
addEventListener("resize", fit); fit();

const clock = document.getElementById("clock"), bar = document.getElementById("bar");
function tick(ts){
  if(!last) last = ts;
  const dt = Math.min(0.05,(ts-last)/1000); last = ts;
  if(playing){ t += dt; if(t>END) t = END; }
  frame(Math.min(t,END));
  clock.textContent = t.toFixed(1)+"s";
  bar.style.width = (100*t/END)+"%";
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

addEventListener("keydown", e=>{
  if(e.code==="Space"){ playing=!playing; e.preventDefault(); }
  if(e.key==="r"||e.key==="R"){ t=0; playing=true; }
  if(e.key==="ArrowRight"){ t=Math.min(END,t+1); }
  if(e.key==="ArrowLeft"){ t=Math.max(0,t-1); }
  if(e.key==="h"||e.key==="H"){ document.body.classList.toggle("clean"); }
});

</script>
</body>
</html>
